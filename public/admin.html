<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>1급 관리자 · 복성고 예약</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body class="admin-page">
  <main class="shell shell--wide">
    <section id="admin-login" class="auth-card card">
      <span class="eyebrow">ADMIN ACCESS</span><h1>1급 관리자 로그인</h1><p>설정 변경은 모두 운영 기록에 남습니다.</p>
      <form id="admin-login-form"><label>이메일<input id="admin-email" type="email" autocomplete="username" required></label><label>비밀번호<input id="admin-password" type="password" autocomplete="current-password" required></label><button class="button button--primary button--large">로그인</button></form>
      <p id="admin-login-error" class="form-error hidden"></p>
    </section>

    <section id="admin-view" class="hidden">
      <header class="staff-header"><div><span class="eyebrow">1급 관리자</span><h1>예약 운영실</h1></div><div class="header-actions"><a class="button button--secondary" href="./staff.html">직원 화면</a><button id="admin-logout" class="button button--text">로그아웃</button></div></header>
      <nav class="tabs" aria-label="관리 메뉴"><button data-tab="overview" class="active">현황</button><button data-tab="settings">설정</button><button data-tab="staff">직원</button><button data-tab="export">내보내기</button></nav>

      <section data-panel="overview">
        <div class="stats-grid"><article class="stat-card"><span>대기</span><strong id="stat-waiting">0</strong></article><article class="stat-card"><span>수령</span><strong id="stat-picked">0</strong></article><article class="stat-card"><span>미수령</span><strong id="stat-missed">0</strong></article><article class="stat-card"><span>취소</span><strong id="stat-cancelled">0</strong></article></div>
        <div class="admin-grid">
          <section class="card"><div class="section-row"><h2>예약 검색</h2></div><input id="reservation-search" class="search-input" placeholder="예약번호 · 학번 · 이름"><div id="admin-reservations" class="data-list"></div></section>
          <section class="card"><h2>쉬는 시간</h2><div id="break-active-panel" class="hidden"><p id="break-active-text"></p><div class="button-row"><button id="extend-break" class="button button--secondary">5분 연장</button><button id="end-break" class="button button--danger-outline">지금 끝내기</button></div></div><form id="break-form"><label>사유<input id="break-reason" maxlength="30" placeholder="기기 오작동"></label><div class="quick-reasons"><button type="button">기기 오작동</button><button type="button">직원 휴게 시간</button><button type="button">재료 준비 중</button></div><label>예정 시간 <output id="break-minutes-output">10분</output><input id="break-minutes" type="range" min="1" max="60" value="10"></label><button class="button button--primary">쉬는 시간 시작</button></form></section>
        </div>
      </section>

      <section data-panel="settings" class="hidden">
        <form id="settings-form" class="card settings-form"><h2>행사 설정</h2><div class="form-grid"><label>행사 이름<input name="eventName" required></label><label>서비스 이름<input name="serviceName" required></label><label>행사 운영 시작<input name="reservationStartAt" type="datetime-local" required></label><label>예약 접수 마감<input name="reservationEndAt" type="datetime-local" required></label><label class="span-2">고객 공지<input name="notice" maxlength="100"></label><label>미수령 수령 가능(초)<input name="noShowGraceSeconds" type="number" min="10" max="600"></label><label>미수령 목록 유지(초)<input name="noShowListSeconds" type="number" min="30" max="3600"></label><label>보류 최대 횟수<input name="maxHoldCount" type="number" min="0" max="10"></label><label class="toggle-label"><input name="acceptingReservations" type="checkbox"> 새 예약 받기</label></div><button class="button button--primary">설정 저장</button></form>
      </section>

      <section data-panel="staff" class="hidden"><div class="admin-grid"><form id="staff-create-form" class="card"><h2>직원 계정 추가</h2><label>표시 이름<input name="name" required maxlength="30"></label><label>이메일<input name="email" type="email" required></label><label>임시 비밀번호<input name="password" type="password" required minlength="8"></label><label>등급<select name="role"><option value="staff">2급 직원</option><option value="admin">1급 관리자</option></select></label><button class="button button--primary">계정 만들기</button></form><section class="card"><h2>직원 목록</h2><div id="staff-list" class="data-list"></div></section></div></section>

      <section data-panel="export" class="hidden"><section class="card export-card"><h2>CSV 내보내기</h2><p>Asia/Seoul 시간대와 UTF-8 BOM을 적용해 Excel에서 바로 열 수 있습니다.</p><div class="export-grid"><button data-export="events" class="button button--secondary">이력 CSV</button><button data-export="operations" class="button button--secondary">운영기록 CSV</button><button data-export="summary" class="button button--primary">요약 CSV</button></div></section></section>
    </section>
    <div id="toast" class="toast hidden" role="alert"></div>
  </main>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
